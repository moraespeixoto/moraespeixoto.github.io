linhas:
  - titulo: Eleições e competição
    texto: >
      Como a competição eleitoral se forma e varia nos mais de 5.500 municípios
      brasileiros, e o que ela faz com a seleção de quem governa.
  - titulo: Dinheiro e campanha
    texto: >
      Financiamento eleitoral em perspectiva comparada: quem financia, quanto pesa o
      dinheiro no desempenho e o que muda quando a regra muda.
  - titulo: Política local e desenvolvimento
    texto: >
      Petro-rendas, gasto público e partidos nos executivos municipais — a política
      local vista pelo orçamento.
  - titulo: Opinião pública e democracia
    texto: >
      Tolerância política, apoio à democracia e comportamento eleitoral, com dados de
      survey e séries de longo prazo.
