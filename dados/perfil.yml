# Identidade do site. Editado a mao.
nome: Vitor de Moraes Peixoto
nome_curto: Vitor Peixoto
titulo: Professor Associado de Ciência Política
kicker: Ciência política · eleições · política local brasileira

resumo: >
  Estudo como a competição eleitoral, o dinheiro de campanha e a política local se
  combinam nos municípios brasileiros — e o que isso produz em representação, gasto
  público e qualidade da democracia.

bio: |
  Graduado em Ciências Sociais pela Universidade Estadual do Norte Fluminense Darcy
  Ribeiro (UENF), com mestrado e doutorado em Ciência Política pelo Instituto
  Universitário de Pesquisas do Rio de Janeiro (IUPERJ).

  Professor Associado da UENF desde 2011, no Centro de Ciências do Homem, e membro
  permanente do Programa de Pós-Graduação em Sociologia Política (PPGSP). Coordeno o
  NERD — Núcleo de Estudos em Representação e Democracia — e integro o Laboratório de
  Estudos da Sociedade Civil e do Estado (LESCE).

  Fui um dos coordenadores da Área Temática de Eleições e Representação Política da
  Associação Brasileira de Ciência Política (ABCP) e tesoureiro da Associação
  Latino-Americana de Ciência Política (ALACIP).

