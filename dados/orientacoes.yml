# Orientacoes.
#
# A lista completa (com o nome de cada orientando, o ano de defesa e o link para
# o Lattes dele) esta no seu curriculo Lattes e entra por:
#
#     python3 ferramentas/importa_lattes.py ~/Downloads/curriculo.xml
#
# O que esta aqui foi o que consegui levantar por busca publica. Nenhum registro
# veio completo — os tres primeiros vieram sem o nome do orientando, e os demais
# vieram da equipe do NERD, sem confirmacao de que sao orientacoes suas. Todos
# estao com publicar: false para nao ir ao ar pela metade. Preencha e vire para
# true, ou deixe a importacao do Lattes resolver de uma vez.
#
# CAMPOS
#   nivel      doutorado | mestrado | pos-doutorado | iniciacao | tcc
#   situacao   concluida | em andamento
