# O NERD — Nucleo de Estudos em Representacao e Democracia.
# Texto, equipe e fotos vindos do site do nucleo:
#   https://gitlab.com/vpeixoto1981/nerd_site
# Sao dois repositorios separados, sem sincronizacao automatica: ao mexer no
# site do NERD, traga a mudanca para ca tambem.
#
# `foto` e um arquivo dentro de ativos/fotos/. Vazio = cai nas iniciais.
# `lattes` e so o numero do ID.

nucleo:
  nome: NERD
  nome_completo: Núcleo de Estudos em Representação e Democracia
  site: https://vpeixoto1981.gitlab.io/nerd_site/
  resumo: >
    Pesquisa sobre a evolução política e eleitoral dos municípios brasileiros — e
    sua relação com o desenvolvimento.
  texto: |
    O Núcleo de Estudos em Representação e Democracia — NERD tem por objetivo
    promover pesquisas sobre a evolução política e eleitoral nos níveis subnacionais,
    principalmente no nível municipal, assim como a relação da mesma com o
    desenvolvimento.

    O grupo aborda a interseção entre três grandes dimensões da análise de sistemas
    políticos democráticos: governos, comportamento eleitoral e partidos políticos. A
    partir dos estudos sobre comportamento dos eleitores, integra os achados empíricos
    às teorias sobre estratégias dos partidos políticos nas administrações públicas
    subnacionais, dialogando com análises sobre reeleição de prefeitos, ideologia
    partidária e gastos públicos no Brasil.

    Suas atividades procuram atender à demanda por informações e análises no Brasil,
    tendo em conta a considerável escassez de informações empíricas sobre as
    características, o funcionamento e o desempenho das instituições políticas no
    nível municipal, bem como a interação da dimensão política com o desenvolvimento
    socioeconômico.
  objetivos:
    - Difundir os resultados das pesquisas para o âmbito acadêmico e extra-acadêmico por meio de encontros, seminários e mini-cursos.
    - Promover a participação de alunos de graduação (iniciação científica) e de pós-graduação nas atividades do núcleo.
    - Estruturar e compartilhar bases de dados destinadas a subsidiar pesquisas acadêmicas e atender demandas de instituições públicas e privadas.
    - Participar de editais de financiamento de pesquisas e de atividades de extensão, ampliando o alcance do núcleo.
  eixos:
    - titulo: Partidos políticos
      texto: Estratégias partidárias, ideologia e sua expressão nas administrações públicas subnacionais.
    - titulo: Comportamento eleitoral
      texto: Competição eleitoral, reeleição e as escolhas do eleitor nos municípios brasileiros.
    - titulo: Governos
      texto: Gestão pública, gastos, políticas municipais e sua relação com o desenvolvimento.

