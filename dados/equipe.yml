# O NERD — Nucleo de Estudos em Representacao e Democracia.
# Texto e equipe herdados do site anterior do nucleo (docs/membros.html).

nucleo:
  nome: NERD
  nome_completo: Núcleo de Estudos em Representação e Democracia
  resumo: >
    O NERD promove pesquisas sobre a evolução política e eleitoral nos níveis
    subnacionais, principalmente o municipal, e sobre a relação dessa evolução com o
    desenvolvimento.
  texto: |
    O grupo aborda a interseção entre três grandes dimensões da análise de sistemas
    políticos democráticos: governos, comportamento eleitoral e partidos políticos. A
    partir dos estudos sobre comportamento dos eleitores, integra achados empíricos às
    teorias sobre estratégias dos partidos nas administrações públicas subnacionais, e
    dialoga com análises sobre reeleição de prefeitos, ideologia partidária e gastos
    públicos no Brasil.

    As atividades do NERD atendem a uma demanda concreta: há escassez de informação
    empírica sobre as características, o funcionamento e o desempenho das instituições
    políticas no nível municipal, e sobre a interação entre a dimensão política e o
    desenvolvimento socioeconômico.

    O núcleo começou em 2011 com o projeto "Competição eleitoral nos municípios
    brasileiros", seguiu com o projeto CNPq "Poder local, partidos políticos e eleições
    municipais no Brasil pós-1988" e hoje é financiado pela FAPERJ com o projeto "Petro
    rendas e política local".
  objetivos:
    - Difundir os resultados das pesquisas no âmbito acadêmico e fora dele — encontros, seminários, mini-cursos.
    - Promover a participação de alunos de graduação (iniciação científica) e de pós-graduação nas atividades do núcleo.
    - Organizar e compartilhar bases de dados que subsidiem pesquisas acadêmicas e demandas de instituições públicas e privadas, formadores de opinião e público em geral.
    - Participar de editais de financiamento de pesquisa e de atividades de extensão.

