- titulo: Competição Eleitoral e Desenvolvimento Socioeconômico nos Municípios Brasileiros
  agencia: Fundação Carlos Chagas Filho de Amparo à Pesquisa do Estado do RJ
  processo: ''
  periodo: 2011 — 2013
  situacao: concluido
  resumo: O principal objetivo deste projeto é produzir uma análise comparativa sistemática acerca das
    características dos sitemas político-administrativos dos 5564 municípios brasileiros sob o marco da
    Constituição de 1988. Pretende-se estudar a dinâmica de interações entre as características político-eleitorais
    e as capacidades administrativas dos municípios, mediadas pelas condições socioeconômicas das unidades
    locais. Através de análises quantitativas, ao final do projeto ter-se-á um panorama tanto mais amplo,
    quanto mais profundo, acerca da dinâmica dos sistemas politicos locais do que se possui hoje. Fundamentalmente,
    pretende-se explorar o(s) porquê(s) das altas variações das condições socioeconomicas e políticas
    existentes nos municípios brasileiros.
  publicar: false
