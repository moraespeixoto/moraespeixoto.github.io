- titulo: Segregação Espacial e Mercado de Trabalho
  agencia: Fundação Carlos Chagas Filho de Amparo à Pesquisa do Estado do RJ
  processo: ''
  periodo: 2012 — 2014
  situacao: concluido
  resumo: O projeto de pesquisa integra o projeto Implantação e ampliação de espaços para estudos integrados
    visando ao desenvolvimento de pesquisas na área de Ciências Humanas cujo objetivo é a construção de
    espaços físicos e implantação de infraestrutura com melhores condições materiais para a execução de
    projetos de pesquisas por pesquisadores das áreas das Ciências Humanas do CCH/UENF. O referido projeto
    tem estreita relação com as linhas de pesquisa dos Programas de Pós-Graduação do CCH, e a presente
    proposta insere-se na linha de pesquisa cidadania, instituições políticas, gestão urbana-metropolitana
    . Considerando que poucos estudos tem se dedicado a apresentar um diagnóstico preciso dos programas
    e projetos habitacionais implantados a partir dos recursos oriundos do Fundo Nacional de Habitação
    de Interesse Social, nos propomos a analisar tais programas, no sentido de formular propostas com
    vistas não só de orientar uma eficiente aplicação dos recursos, mas, também, de realizar uma avaliação,
    ex-post-facto, de seus efeitos, permitindo sua melhor compreensão. O foco é o programa habitacionais
    municipais Morar Feliz, de Campos dos Goytacazes e o Macaé Sem Favelas, de Macaé. A oferta de moradia
    vem promovendo o reassentamento e o assentamento de famílias de áreas degradadas para ambientes mais
    salubres, representando, no discurso oficial, a aquisição de uma melhor qualidade de vida urbana pelos
    beneficiados dos programas habitacionais. Assim, o objetivo deste projeto é discutir a inserção no
    mercado de trabalho formal/informal como sendo um dos elementos que compõem e é reflexo do processo
    de segmentação e segregação espacial produzida pela sociedade, conduzindo a formação do que estamos
    chamando de Novos Territórios Urbanos , e que será objeto de teorização no decorrer da presente pesquisa,
    contribuindo, dessa forma, contribuindo para o desenvolvimento das pesquisas na área de Ciências Humanas
  publicar: false
- titulo: 'Financiamento de Campanhas nas Eleições Legislativas Brasileiras em 2010: uma análise quantitativa'
  agencia: Fundação Carlos Chagas Filho de Amparo à Pesquisa do Estado do RJ
  processo: ''
  periodo: 2012 — 2014
  situacao: concluido
  resumo: 'A pergunta que se pretende responder neste projeto concerne às características individuais
    dos candidatos que afetam seus respectivos resultados eleitorais. A partir de então, busca-se precisar
    o efeito específico dos gastos de campanha nas eleições legislativas brasileiras. Mais especificamente,
    este projeto disserta acerca do impacto dos gastos de campanhas sobre os votos nas eleições proporcionais
    de 2010. Tendo como unidade de observação as candidaturas individuais aos cargos de Deputado Federal
    e Estadual (distrital), analisam-se, portanto, os efeitos das variáveis que influenciam os desempenhos
    eleitorais, tais como gênero, idade, ocupação, partido, estado civil, escolaridade e, principalmente,
    os montantes de recursos de campanhas declarados ao TSE. Por meio da análise econométrica clássica
    (OLS), pode-se estimar com os efeitos destas variáveis num contexto multidimensional, dito de outra,
    os modelos estimados permitiram acesso ao impacto isolado das características individual dos candidatos
    sobre os resultados de suas campanhas: os votos.'
  publicar: false
