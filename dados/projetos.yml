# Projetos de pesquisa financiados e projetos de dados/codigo.
# Comentarios no meio dos dados se perdem na proxima coleta — ver README.md.

pesquisa:

  - titulo: "Petro rendas e política local: competição eleitoral e políticas públicas em municípios produtores de petróleo"
    agencia: FAPERJ
    processo: "E-26/210-545/2019"
    periodo: "2019 —"
    situacao: em andamento
    resumo: >
      Investiga padrões partidários de gasto público em municípios petro-rentistas em
      dois contextos econômicos: abundância e crise severa de recursos. Constrói
      indicadores e testa modelos econométricos multivariados para explorar as
      características políticas dos executivos municipais associadas à variação dos
      padrões de comportamento orçamentário na administração de recursos
      indenizatórios, comparando unidades da federação com perfil sociodemográfico
      similar.
    publicar: true

  - titulo: "Economia social da (in)tolerância política: como avaliações da economia, mobilidade social, escolaridade, gênero e religião impactam as atitudes democráticas no Brasil contemporâneo"
    agencia: ""
    processo: ""
    periodo: ""
    situacao: em andamento
    resumo: >
      Analisa avaliações e percepções econômicas e seus impactos sobre tolerância
      política ao longo dos últimos quatro ciclos eleitorais, e como variáveis
      sociológicas clássicas — religião, escolaridade, renda e sexo — se relacionam à
      tolerância e ao apoio à democracia.
    publicar: true

  - titulo: "Poder local, partidos políticos e eleições municipais no Brasil pós-1988"
    agencia: CNPq
    processo: ""
    periodo: ""
    situacao: concluido
    resumo: >
      Análises sistemáticas das dinâmicas político-eleitorais nos municípios
      brasileiros no pós-88: quais fatores sociodemográficos, políticos e econômicos
      estão associados às características do poder local, e se a institucionalização do
      sistema partidário pode ser explicada pelo perfil dos municípios e pelas regras
      eleitorais.
    publicar: true

  - titulo: "Financiamento de campanhas eleitorais no Brasil"
    agencia: FAPERJ
    processo: "APQ3 E-26/112.214/2013"
    periodo: "2013 —"
    situacao: concluido
    resumo: ""
    publicar: true

  - titulo: "Competição eleitoral nos municípios brasileiros"
    agencia: FAPERJ
    processo: "E-26/111-677/2011"
    periodo: "2011 —"
    situacao: concluido
    resumo: >
      Projeto que deu início às atividades do NERD.
    publicar: true

