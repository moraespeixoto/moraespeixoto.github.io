- titulo: 'Política e desenvolvimento nos municípios do norte e noroeste fluminense: uma análise comparada'
  agencia: Fundação Carlos Chagas Filho de Amparo à Pesquisa do Estado do RJ
  processo: ''
  periodo: 2011 — 2013
  situacao: concluido
  resumo: O projeto busca, por meio de informações empíricas sobre o desempenho e funcionamento das instituições
    políticas municipais e de suas interações com o desenvolvimento econômico local, contribuir para reduzir
    o déficit informacional que envolve os municípios do Norte e Noroeste Fluminense numa perspectiva
    comparada com os demais municípios e regiões do Estado do Rio de Janeiro. O recorte temporal corresponde
    ao período compreendido entre os anos de 1996 e 2012, o que equivale a quatro ciclos completos de
    mandatos e eleições municipais. Além disso, será possível comparar a situação dos municípios antes
    da Lei do Petróleo de 1997, que altera as regras de rateio dos royalties do petróleo e institui a
    flexibilização do monopólio na exploração e produção de petróleo e gás com o período subsequente.
    Na dimensão político-eleitoral, os objetivos são produzir análises multivariadas acerca das características
    dos sistemas políticos locais; os orçamentos e gastos das administrações municipais; e a produção
    legislativa dos vereadores. Neste eixo também se inclui análises das percepções dos vereadores quanto
    a sua função, atuação e das demandas do eleitorado. Na dimensão socioeconômica o estudo prioriza a
    análise do perfil dos municípios das regiões Norte e Noroeste Fluminense e suas possíveis alterações
    provocadas pelas atividades produtivas decorrentes da dinâmica das atividades petrolíferas, bem como
    dos recentes investimentos de grande magnitude, como os complexos logísticos do Açu e Barra do Furado.
    A ambição da proposta é buscar, no cruzamento das variáveis trabalhadas na pesquisa, associações e
    possíveis relações de causalidade existentes entre os dois eixos analíticos definidos. Pretende-se
    desta forma contribuir com produção de informação e conhecimento relevante para o desenvolvimento
    político, econômico e social das regiões Norte e Noroeste Fluminense, regiões de inserção da Universidade
    Estadual do Norte Fluminense Darcy Ribeiro.
  publicar: false
