- titulo: 'l AS METRÓPOLES E O DIREITO À CIDADE: conhecimento, inovação e ação para o desenvolvimento
    urbano ? Programa de Pesquisa da Rede Observatório das Metrópoles 2015-2020 - CHAMADA PÚBLICA MCTI/CNPQ/CAPES/FAPSNº
    16/2014 - PROGRAMA INCT'
  agencia: ''
  processo: ''
  periodo: 2016 — 2021
  situacao: concluido
  resumo: 'O presente projeto temcomo objetivos principais: (i) Contribuir para colocar a questão do desenvolvimento
    urbano no centro do debate sobre desenvolvimento nacional reconhecendo a importância da dinâmica urbana-metropolitana
    como elemento crucial para pensar o passado, o presente e o futuro da nação brasileira; (ii) identificar
    mecanismos produtores de bloqueios e avanços no bem-estar urbano, na sustentabilidade ambiental e
    na superação das desigualdades sociais; (iii) desenvolver uma teoria na escala metropolitana, mobilizando
    conhecimentos disciplinares particulares, e metodologias de pesquisa visando contribuir para a constituição
    de uma plataforma de conhecimento sobre o tema urbano-metropolitano; e produzir subsídios visando
    contribuir coma formação de políticas públicas e novos padrões de governança metropolitana fundadas
    na justiça social e na democracia.&#10;Situação: Em andamento; Natureza: Pesquisa.'
  publicar: false
- titulo: 'Democracia na Escola: eleições e gestão democrática participativa'
  agencia: ''
  processo: ''
  periodo: 2017 — 2019
  situacao: concluido
  resumo: O Democracia na Escola tem por objetivo auxiliar, produzir, analisar, debater, acompanhar, formar
    e avaliar o processo de instituição de mecanismos de participação democrática na gestão escolar, em
    geral, nos municípios do Estado do Rio de Janeiro e, em particular, de Campos dos Goytacazes. Estabelecer-se-á
    um grupo interdisciplinar que contará com a cooperação institucional de docentes do Instituto Federal
    Fluminense (IFF Campos) e da Universidade Estadual do Norte Fluminense Darcy Ribeiro (UENF) e apoiados
    pela Secretaria Municipal de Educação de Campos dos Goytacazes com o propósito basilar de participar
    ativamente do processo de criação e instalação de instrumentos e processos de participação democrática
    nas escolas municipais, notadamente, eleições para diretores de escolas, conselhos escolares e formação
    de membros da gestão escolar.&#10;As atividades do projeto objetivam atender a demanda de informações
    e as análises considerando que existe uma considerável escassez de informações empíricas sobre as
    características, funcionamento e desempenho das instituições políticas no nível escolar local, assim
    como da interação da dimensão política com aspectos educacionais.
  publicar: false
- titulo: 'Economia social da (In)tolerância política: como avaliações da economia, mobilidade social,
    escolaridade, gênero e religião impactam as atitudes democráticas no Brasil contemporâneo'
  agencia: Universidade Estadual do Norte Fluminense Darcy Ribeiro
  processo: ''
  periodo: '2018'
  situacao: em andamento
  resumo: Este projeto visa produzir análises acerca das avaliações e percepções econômicas e seus impactos
    sobre um conjunto de atitudes e comportamentos individuais conhecidos por tolerância política ao longo
    dos últimos quatro ciclos eleitorais. Além disso, busca compreender como as variáveis sociológicas
    clássicas tais como religião, escolaridade, renda e sexo se relacionam aos aspectos tolerância e apoio
    à democracia. Dessa forma, procura aferir como essas variáveis interferem na opinião pública sobre
    a democracia, investigando e diferenciando o comportamento de grupos específicos em relação as organizações
    democráticas
  publicar: false
- titulo: 'Pesquisa e formação em Sociologia: desafios e contribuições do Programa de Sociologia Política
    da UENF.'
  agencia: Fundação Carlos Chagas Filho de Amparo à Pesquisa do Estado do RJ
  processo: ''
  periodo: '2019'
  situacao: em andamento
  resumo: O Programa de Pós-graduação em Sociologia Política da UENF ? PPGSP, recomendado pela CAPES e
    iniciado em 2007 nos níveis de mestrado e doutorado, tem como objetivo a formação de pesquisadores/as
    qualificados para atuarem em ensino e pesquisa no Brasil e no exterior. A produção de conhecimento
    científico do PPGSP está vinculada as suas linhas de pesquisas baseadas em abordagens teórico-metodológicas
    sobre as realidades sociopolíticas brasileira. O PPGSP tem ampliado as suas atividades e buscado o
    aperfeiçoamento contínuo das condições para o desenvolvimento das atividades de docência e pesquisa
    contribuindo com os desafios e avanços do conhecimento na área de Sociologia. O conjunto de ações
    previstas no projeto visa também melhorar o seu conceito na avaliação da CAPES. Ainda pretende-se
    intensificar a interação com outras instituições de relevância científica por meio de intercâmbios
    e parcerias que consolidem o PPGSP como centro de referência regional de estudo e pesquisa
  publicar: false
