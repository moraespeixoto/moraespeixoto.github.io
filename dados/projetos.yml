pesquisa:
- titulo: 'Bolsonarismo e política local: o combate à pandemia e os reflexos no Plano Nacional de Vacinação
    (PNI) nos municípios'
  agencia: FAPERJ
  processo: APQ1 E-26/210.358/2024
  periodo: 2024 —
  situacao: em andamento
  resumo: Investiga os impactos do bolsonarismo nas políticas locais de combate à pandemia de Covid-19
    e seus reflexos no Plano Nacional de Imunização (PNI) nos municípios brasileiros. Analisa como o alinhamento
    político-ideológico dos governos municipais com o governo federal influenciou a adesão às campanhas
    de vacinação, avaliando as consequências sanitárias e políticas dessas dinâmicas no nível local.
  publicar: true
- titulo: Economia social da (in)tolerância política
  agencia: ''
  processo: ''
  periodo: ''
  situacao: em andamento
  resumo: Como avaliações da economia, mobilidade social, escolaridade, gênero e religião impactam as
    atitudes democráticas no Brasil contemporâneo. Produz análises sobre as percepções econômicas e seus
    impactos sobre tolerância política ao longo dos últimos quatro ciclos eleitorais, e sobre como variáveis
    sociológicas clássicas — religião, escolaridade, renda e sexo — se relacionam à tolerância e ao apoio
    à democracia.
  publicar: true
- titulo: 'Petro rendas e política local: competição eleitoral e políticas públicas em municípios produtores
    de petróleo'
  agencia: FAPERJ
  processo: E-26/210-545/2019
  periodo: 2019 —
  situacao: em andamento
  resumo: 'Investiga padrões partidários de gastos públicos em municípios petro-rentistas em dois contextos
    econômicos: de abundância e de crises severas de recursos. Constrói indicadores e testa modelos econométricos
    multivariados para explorar as características políticas dos executivos municipais associadas à variação
    dos padrões de comportamento orçamentário na administração de recursos indenizatórios, comparando
    unidades da federação com características sociodemográficas similares.'
  publicar: true
