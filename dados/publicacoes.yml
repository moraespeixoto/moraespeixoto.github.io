#   doi       so o sufixo canonico, sem o https://doi.org/
#   url       link alternativo quando nao ha DOI (pagina do periodico, PDF)
#   publicar  false esconde o item do site sem apaga-lo do arquivo
#   fonte     de onde veio o registro (lattes, orcid, crossref, zenodo, osf, manual)
#
# Comentarios no meio dos dados se perdem na proxima coleta — ver README.md.

