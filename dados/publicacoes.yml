# COMO ESTE ARQUIVO E MANTIDO
#   Este e o arquivo-semente, montado a mao. Ele NAO e a lista completa.
#   A lista completa vem das ferramentas, que rodam na sua maquina (no container
#   do Claude Code na web a rede e fechada e ORCID/Crossref/Zenodo/OSF nao
#   respondem):
#
#     python3 ferramentas/importa_lattes.py ~/Downloads/curriculo.xml
#     python3 ferramentas/coleta_publicacoes.py
#     python3 ferramentas/gera_site.py
#
#   As duas primeiras mesclam por DOI e por titulo normalizado, preservam o que
#   voce editou a mao e nunca apagam um registro existente.
#
