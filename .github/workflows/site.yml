name: site

# Regenera docs/ sempre que o conteudo ou o gerador mudam, e devolve o resultado
# ao branch. Assim da para editar dados/*.yml direto pelo GitHub e ver o site
# atualizar sozinho, sem toolchain local.
#
# O push daqui usa o GITHUB_TOKEN, e o GitHub nao dispara workflows para pushes
# feitos com ele — nao ha laco.

on:
  push:
    paths:
      - "dados/**"
      - "ativos/**"
      - "ferramentas/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install pyyaml

      - run: python3 ferramentas/gera_site.py

      - name: Commitar docs/ se mudou
        run: |
          if git diff --quiet -- docs/; then
            echo "docs/ ja estava em dia."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "regenera docs/ a partir de dados/"
          git push
